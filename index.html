<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#111318" />
  <title>AMP • Phase 1</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">THE ALFRED MASS PROTOCOL</div>
        <h1>AMP • Phase 1</h1>
        <div id="phaseMeta" class="muted">Weeks 1–4 • Baseline & execution</div>
      </div>
      <button id="installBtn" class="ghost hidden">Install</button>
    </header>

    <main id="main"></main>

    <nav class="bottom-nav" aria-label="Primary navigation">
      <button data-view="today" class="nav-btn active"><span>▣</span><small>Today</small></button>
      <button data-view="program" class="nav-btn"><span>≡</span><small>Program</small></button>
      <button data-view="history" class="nav-btn"><span>↻</span><small>History</small></button>
      <button data-view="progress" class="nav-btn"><span>↗</span><small>Progress</small></button>
      <button data-view="guide" class="nav-btn"><span>?</span><small>Guide</small></button>
    </nav>
  </div>

  <dialog id="infoDialog">
    <form method="dialog" class="dialog-card">
      <div class="dialog-head">
        <h3 id="dialogTitle">Info</h3>
        <button class="icon-btn" aria-label="Close">×</button>
      </div>
      <div id="dialogBody"></div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
